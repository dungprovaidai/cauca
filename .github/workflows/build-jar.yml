name: Build mod jar

on:
  push:
    branches:
      - arena/01a0a604-cauca
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21 and Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
          cache-read-only: true

      - name: Build jar
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cauca-fishing-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cauca-fishing-jars
          path: build/libs/*.jar
          if-no-files-found: error
