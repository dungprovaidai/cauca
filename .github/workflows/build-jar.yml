name: Build mod jar

on:
  push:
    branches:
      - arena/01a0a604-cauca
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21 and Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
          cache-read-only: true

      - name: Build jar
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish compiler output to a check run
        if: failure()
        uses: actions/github-script@v7
        env:
          BUILD_LOG: build.log
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync(process.env.BUILD_LOG)
              ? fs.readFileSync(process.env.BUILD_LOG, 'utf8')
              : 'Gradle did not produce a build log.';
            const tail = log.length > 60000 ? log.slice(-60000) : log;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Gradle compiler output',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: 'Gradle build failed',
                summary: '```text\\n' + tail + '\\n```'
              }
            });

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cauca-fishing-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cauca-fishing-jars
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create GitHub release and upload jar
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0
        run: |
          set -euo pipefail
          jar="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort | head -n 1)"
          test -n "$jar"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$jar" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$jar" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Ca Cauca Fishing Overhaul 0.1.0" \
              --notes "NeoForge 1.21.1 fishing overhaul build from commit $GITHUB_SHA."
          fi
